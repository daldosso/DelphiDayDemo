name: DelphiDay CD Simple Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  deploy_job:
    runs-on: self-hosted

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # 1. Vediamo cosa vede davvero il runner nella cartella
    - name: Debug - List Files
      run: |
        Write-Host "--- Contenuto della cartella corrente ---"
        Get-ChildItem -Recurse -Depth 2
      shell: powershell

    # 2. Controllo dell'eseguibile (corretto per evitare falsi negativi)
    - name: Verify Compiled Binary
      run: |
        $exePath = "Win32\Release\DelphiDayDemo.exe"
        if (Test-Path $exePath) {
            Write-Host "Success: DelphiDayDemo.exe found!"
        } else {
            Write-Warning "ATTENZIONE: L'eseguibile non è presente in $exePath"
            Write-Warning "Hai fatto il push dell'eseguibile su Git? Se è nel .gitignore, la pipeline fallirà qui."
            exit 1
        }
      shell: powershell

    # 3. Creazione cartella di destinazione automatica + Copia
    - name: Deploy to Live Server
      run: |
        $destination = "C:\LiveServer\bin\"
        
        # Se la cartella di destinazione non esiste, la creiamo noi
        if (-not (Test-Path $destination)) {
            New-Item -ItemType Directory -Force -Path $destination
        }
        
        Write-Host "Deploying executable to $destination ..."
        # Usiamo Copy-Item di PowerShell, più nativo e parlante di xcopy
        Copy-Item -Path "Win32\Release\DelphiDayDemo.exe" -Destination $destination -Force
        Write-Host "Deployment completed successfully!"
      shell: powershell