name: Production & Staging CI/CD Pipeline

on:
  # Rende il workflow interattivo per la scelta dell'ambiente
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Seleziona l''ambiente di destinazione'
        type: choice
        required: true
        default: 'staging'
        options:
          - staging
          - production

  # Esegue l'automazione del triage quando viene aperta o modificata una issue
  issues:
    types: [opened, edited]

jobs:
  # JOB 1: Automazione della gestione del repository
  triage-issues:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - name: Label Bug
        if: contains(github.event.issue.body, 'bug')
        run: echo "::add-labels: bug"

      - name: Label Feature
        if: contains(github.event.issue.body, 'feature')
        run: echo "::add-labels: feature"

      - name: Label Triage
        if: "!contains(github.event.issue.body, 'bug') && !contains(github.event.issue.body, 'feature')"
        run: echo "::add-labels: needs-triage"

  # JOB 2: Compilazione, Backup e Deploy dell'applicazione Delphi
  build-and-deploy:
    if: github.event_name == 'workflow_dispatch'
    environment: ${{ github.event.inputs.target_env }}
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Compilazione del Progetto Delphi
      - name: Compile Delphi Project
        shell: cmd
        run: |
          call "%BDSBIN%\rsvars.bat"
          msbuild DelphiDayDemo.dproj /p:Config=Release /t:Build

      # 2. Backup Remoto via FTP (Usa l'URL dinamico dell'Environment scelto)
      - name: Backup Remote Binary
        shell: powershell
        run: |
          $url = "${{ vars.FTP_URL }}/app.exe"
          $ftp = [System.Net.FtpWebRequest]::Create($url)
          $ftp.Credentials = New-Object Net.NetworkCredential(`
              "${{ secrets.FTP_USERNAME }}", "${{ secrets.FTP_PASSWORD }}")
          $ftp.Method = [Net.WebRequestMethods+Ftp]::Rename
          $ftp.RenameTo = "app_$(Get-Date -f yyyyMMdd).bak"
          $ftp.GetResponse().Close()

      # 3. Staging Locale (Prepara l'alberatura delle cartelle sul Runner)
      - name: Prepare Staging Directory
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "dist\bin"
          New-Item -ItemType Directory -Force -Path "dist\config"
          Copy-Item "Win32\Release\*.exe" -Destination "dist\bin"
          Copy-Item "assets\config.json" -Destination "dist\config"

      # 4. Deploy Multi-Cartella atomico (Mirroring della cartella dist)
      - name: Deploy via FTP (Mirroring)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /var/www/app/